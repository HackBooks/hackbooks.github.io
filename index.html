<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackBook - Cybersecurity & CTF Toolbox</title>
    <script src="https://cdn.tailwindcss.com"></script><
    <link rel="stylesheet" href="assets/css/style.css">
    </head>
<body class="text-gray-100">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <header class="text-center mb-12">
            <div class="flex items-center justify-center mb-4">
                <div class="text-5xl mr-3">🛡</div>
                <h1 class="text-5xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                    HackBook
                </h1>
            </div>
            <p class="text-gray-400 text-lg">Your Open-Source Cybersecurity & CTF Toolbox</p>
            <p class="text-sm text-gray-500 mt-2">Search, Browse, and Add Security Tools</p>
        </header>

        <!-- Search and Filter Bar -->
        <div class="mb-8 space-y-4">
            <div class="flex gap-3">
                <div class="flex-1 relative">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search tools by name or tags (e.g., python, web, crypto)..." 
                        class="w-full px-4 py-3 bg-slate-800 text-gray-100 rounded-lg border border-slate-700 focus:border-blue-500 transition"
                    />
                    <svg class="absolute right-4 top-3.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <button 
                    onclick="openModal()" 
                    class="btn-primary px-6 py-3 rounded-lg font-semibold flex items-center gap-2 whitespace-nowrap"
                >
                    <span class="text-xl">+</span> Add Tool
                </button>
            </div>

            <!-- Tag Filter Buttons -->
            <div id="tagFilters" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Tool Count -->
        <div class="mb-6 text-center">
            <span id="toolCount" class="text-gray-400 text-sm"></span>
        </div>

        <!-- Tools Grid -->
        <div id="toolsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- Tools will be dynamically inserted here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-16 hidden">
            <div class="text-6xl mb-4">🔍</div>
            <p class="text-gray-400 text-lg">No tools found matching your search</p>
            <p class="text-gray-500 text-sm mt-2">Try a different search term or add a new tool</p>
        </div>
    </div>

    <!-- Add Tool Modal -->
    <div id="addToolModal" class="modal fixed inset-0 hidden items-center justify-center z-50">
        <div class="bg-slate-800 rounded-xl p-8 max-w-2xl w-full mx-4 border border-slate-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-blue-400">Add New Tool</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-200 text-2xl">&times;</button>
            </div>
            
            <form id="addToolForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Tool Name *</label>
                    <input 
                        type="text" 
                        id="toolName" 
                        required 
                        class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-gray-100"
                        placeholder="e.g., Nmap"
                    />
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2">Description *</label>
                    <textarea 
                        id="toolDescription" 
                        required 
                        rows="3" 
                        class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-gray-100"
                        placeholder="Brief description of what the tool does"
                    ></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2">Category *</label>
                    <select 
                        id="toolCategory" 
                        required 
                        class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-gray-100"
                    >
                        <option value="">Select a category</option>
                        <option value="reconnaissance">Reconnaissance</option>
                        <option value="exploitation">Exploitation</option>
                        <option value="web">Web Security</option>
                        <option value="crypto">Cryptography</option>
                        <option value="forensics">Forensics</option>
                        <option value="reverse">Reverse Engineering</option>
                        <option value="pwn">Binary Exploitation</option>
                        <option value="network">Network Analysis</option>
                        <option value="steganography">Steganography</option>
                        <option value="osint">OSINT</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2">Installation Command</label>
                    <input 
                        type="text" 
                        id="toolInstall" 
                        class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg code-font text-sm text-gray-100"
                        placeholder="e.g., apt install nmap"
                    />
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2">Usage Example</label>
                    <input 
                        type="text" 
                        id="toolUsage" 
                        class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg code-font text-sm text-gray-100"
                        placeholder="e.g., nmap -sV target.com"
                    />
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2">Tags (comma-separated)</label>
                    <input 
                        type="text" 
                        id="toolTags" 
                        class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-gray-100"
                        placeholder="e.g., python, scanner, network"
                    />
                    <p class="text-xs text-gray-500 mt-1">Separate multiple tags with commas</p>
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button 
                        type="submit" 
                        class="btn-primary flex-1 py-3 rounded-lg font-semibold"
                    >
                        Add Tool
                    </button>
                    <button 
                        type="button" 
                        onclick="closeModal()" 
                        class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold transition"
                    >
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
        
</body>
</html>
